name: FarmDay private media analysis
on:
  workflow_dispatch:
    inputs:
      upload_id:
        description: 'Optional upload UUID (blank = pending originals)'
        required: false
        type: string
  repository_dispatch:
    types: [farmday_media_ready]
permissions:
  contents: read
concurrency:
  group: farmday-private-media-worker
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.repository == 'joelndoci-farmday/farmday'
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Chromaprint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libchromaprint-tools
      - name: Test similarity engine
        run: python3 -m unittest discover -s media-worker -p 'test_*.py' -v
      - name: Analyze privately stored originals
        env:
          SUPABASE_URL: ${{ secrets.FARMDAY_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FARMDAY_SUPABASE_SERVICE_ROLE_KEY }}
          FARMDAY_YOUTUBE_API_KEY: ${{ secrets.FARMDAY_YOUTUBE_API_KEY }}
        run: python3 media-worker/cloud_runner.py
